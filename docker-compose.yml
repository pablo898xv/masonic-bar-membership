# Local data plane matching Firebase Hosting / Firestore (same shape as live).
#
# Default (laptop): Firestore + Auth emulators + Mailpit. Next.js still runs on
# the host (`npm run dev`) — equivalent to Hosting + Cloud Functions.
#
#   bash deploy/local/setup.sh
#   npm run dev
#
# Hosting-parity (Hyper-V VM or production-like local): also start the Next.js
# container (`next start` standalone) instead of `npm run dev`.
#
#   bash deploy/local/setup.sh --hosting
#   # or: docker compose --profile hosting up -d --build
#
# Hyper-V guests bind Traefik on 0.0.0.0 so the Windows host can reach :80/:443:
#   PUBLISH_HOST=0.0.0.0 docker compose --profile hosting up -d --build
#
# Public interfaces are only 80 and 443 (Traefik). HTTP on :80 is Let's Encrypt
# HTTP-01 plus a permanent redirect to HTTPS. App / Portainer / Mailpit
# ports stay on the Docker network. Host-header routing mimics Firebase
# Hosting custom domains. Point DNS or a hosts file at the VM:
#   ashlartechnologies.com / www / membership  →  web
#   portainer.ashlartechnologies.com           →  Portainer
#   relay.ashlartechnologies.com               →  Mailpit
#   traefik.ashlartechnologies.com             →  Traefik dashboard
# Override the suffix with HOST_DOMAIN in `.env`. Add another module with the
# same Traefik labels (see deploy/local/extra-module.example.yml).

services:
  # Edge router: Host() / PathPrefix() → container. Same role as Firebase Hosting
  # custom domains + rewrites. Later, those hostnames can CNAME to Google.
  traefik:
    image: traefik:v3.6.1
    container_name: masonic-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=masonic_private
      - --providers.file.filename=/etc/traefik/tls.yml
      - --entrypoints.web.address=:80
      # HTTP is only for Let's Encrypt HTTP-01. Traefik skips this redirect for
      # /.well-known/acme-challenge/. Everything else goes to HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=WARN
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-webmaster@ashlartechnologies.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:80:80"
      - "${PUBLISH_HOST:-127.0.0.1}:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./deploy/local/traefik-tls.yml:/etc/traefik/tls.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.admin-acl.ipallowlist.sourcerange=${ADMIN_ACL:-10.0.1.0/24,92.207.102.100/30,62.223.215.229/32}
      - traefik.http.middlewares.login-ratelimit.ratelimit.average=8
      - traefik.http.middlewares.login-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.login-ratelimit.ratelimit.burst=12
      - traefik.http.middlewares.public-ratelimit.ratelimit.average=40
      - traefik.http.middlewares.public-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.public-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.secure-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.secure-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()
      - traefik.http.middlewares.secure-headers.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.middlewares.secure-headers.headers.customResponseHeaders.Server=
      - traefik.http.routers.dashboard.rule=Host(`traefik.${HOST_DOMAIN:-ashlartechnologies.com}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.middlewares=admin-acl,secure-headers
      - traefik.http.routers.dashboard.service=api@internal
    networks:
      - masonic_private

  firebase:
    build:
      context: ./deploy/local
      dockerfile: Dockerfile.firebase
    container_name: masonic-firebase
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-masonic-bar}
      # Cap the Java heap so the emulator fits a small Hyper-V guest.
      JAVA_TOOL_OPTIONS: ${FIREBASE_JAVA_OPTS:--Xmx768m}
    volumes:
      - ./deploy/local/firebase.json:/firebase/firebase.json:ro
      - ./.firebaserc:/firebase/.firebaserc:ro
      - ./firestore.rules:/firebase/firestore.rules:ro
      - ./firestore.indexes.json:/firebase/firestore.indexes.json:ro
      - firebase_data:/firebase/data
      - firebase_cache:/root/.cache/firebase
    ports:
      - "127.0.0.1:4000:4000"   # Emulator UI (loopback only; not a public site)
      - "127.0.0.1:8080:8080"   # Firestore (host `npm run dev`)
      - "127.0.0.1:9099:9099"   # Auth (host `npm run dev`)
      - "127.0.0.1:4400:4400"   # Hub
      - "127.0.0.1:4500:4500"   # Logging
      - "127.0.0.1:9150:9150"   # Firestore UI websocket
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 120s
    stop_grace_period: 1m
    networks:
      - masonic_private

  # SMTP stand-in for production mail. SMTP is loopback-only (host `npm run dev`).
  # The Mailpit UI is on relay.${HOST_DOMAIN} via Traefik, restricted by ADMIN_ACL.
  mailpit:
    image: axllent/mailpit:latest
    container_name: masonic-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1125:1025"
    labels:
      - traefik.enable=true
      - traefik.http.services.relay.loadbalancer.server.port=8025
      - traefik.http.routers.relay.rule=Host(`relay.${HOST_DOMAIN:-ashlartechnologies.com}`)
      - traefik.http.routers.relay.entrypoints=websecure
      - traefik.http.routers.relay.tls=true
      - traefik.http.routers.relay.tls.certresolver=letsencrypt
      - traefik.http.routers.relay.middlewares=admin-acl,secure-headers
    networks:
      - masonic_private

  # Firebase Hosting + Cloud Functions (frameworksBackend) stand-in.
  # Production `next start`, talking to the emulators over the compose network.
  web:
    profiles: ["hosting"]
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.app
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://membership.ashlartechnologies.com}
    container_name: masonic-web
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-masonic-bar}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-demo-masonic-bar}
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      USE_LOCAL_DB: "false"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://membership.ashlartechnologies.com}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ./certs/apple-wallet:/app/certs/apple-wallet:ro
    depends_on:
      firebase:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.services.membership.loadbalancer.server.port=3000
      # Public hostname: HTTPS only. Port 80 is the entrypoint redirect + ACME.
      - traefik.http.routers.membership.rule=Host(`membership.${HOST_DOMAIN:-ashlartechnologies.com}`)
      - traefik.http.routers.membership.entrypoints=websecure
      - traefik.http.routers.membership.tls=true
      - traefik.http.routers.membership.tls.certresolver=letsencrypt
      - traefik.http.routers.membership.middlewares=secure-headers
      - traefik.http.routers.membership-login.rule=Host(`membership.${HOST_DOMAIN:-ashlartechnologies.com}`) && Path(`/api/auth/login`)
      - traefik.http.routers.membership-login.entrypoints=websecure
      - traefik.http.routers.membership-login.tls=true
      - traefik.http.routers.membership-login.tls.certresolver=letsencrypt
      - traefik.http.routers.membership-login.middlewares=login-ratelimit,secure-headers
      - traefik.http.routers.membership-login.service=membership
      - traefik.http.routers.membership-login.priority=100
      - traefik.http.routers.membership-public.rule=Host(`membership.${HOST_DOMAIN:-ashlartechnologies.com}`) && (Path(`/api/auth/register`) || Path(`/api/memberships/lookup`) || Path(`/api/payments/webhook`) || Path(`/api/payments/initiate`) || Path(`/api/members`) || Path(`/api/memberships`))
      - traefik.http.routers.membership-public.entrypoints=websecure
      - traefik.http.routers.membership-public.tls=true
      - traefik.http.routers.membership-public.tls.certresolver=letsencrypt
      - traefik.http.routers.membership-public.middlewares=public-ratelimit,secure-headers
      - traefik.http.routers.membership-public.service=membership
      - traefik.http.routers.membership-public.priority=80
      # LAN / hosts-file names (apex and www DNS are not this VM).
      - traefik.http.routers.membership-lan.rule=Host(`${HOST_DOMAIN:-ashlartechnologies.com}`) || Host(`www.${HOST_DOMAIN:-ashlartechnologies.com}`)
      - traefik.http.routers.membership-lan.entrypoints=websecure
      - traefik.http.routers.membership-lan.tls=true
      - traefik.http.routers.membership-lan.middlewares=admin-acl,secure-headers
      - traefik.http.routers.membership-lan.service=membership
    networks:
      - masonic_private

  # Web UI for Docker Engine (containers, logs, volumes, compose).
  # Free Portainer CE — first visit sets the admin password.
  # App data stays in the Firebase emulator UI on port 4000.
  portainer:
    image: portainer/portainer-ce:lts
    container_name: masonic-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.portainer.rule=Host(`portainer.${HOST_DOMAIN:-ashlartechnologies.com}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt
      - traefik.http.routers.portainer.middlewares=admin-acl,secure-headers
    networks:
      - masonic_private

networks:
  masonic_private:
    name: masonic_private
    driver: bridge

volumes:
  firebase_data:
  firebase_cache:
  portainer_data:
  traefik_letsencrypt:
